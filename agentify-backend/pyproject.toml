[project]
name = "agentify-backend"
version = "0.1.0"
description = "Backend for the agentify application."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.118.1",
    "firebase-admin<7",
    "google-cloud-firestore>=2.21.0",
    "google-genai>=1.45.0",
    "langchain>=1.0.2",
    "langchain-google-vertexai>=3.0.0",
    "pydantic>=2.12.0",
    "pytest>=8.4.2",
    "python-dotenv>=1.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
log_cli = 1
log_cli_level = "INFO"
