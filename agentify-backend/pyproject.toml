[project]
name = "agentify-backend"
version = "0.1.0"
description = "Backend for the agentify application."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=2.1.9",
    "fastapi[standard]>=0.118.1",
    "firebase-admin>=7.1.0",
    "google-cloud-firestore>=2.21.0",
    "google-genai>=1.45.0",
    "pydantic>=2.12.0",
    "pytest>=8.4.2",
    "python-dotenv>=1.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
